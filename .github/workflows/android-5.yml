name: Android CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Show Java and Gradle versions
        run: |
          java -version
          gradle --version

      - name: Build Client and Manager
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace --info \
            :client:assembleDebug \
            :manager:assembleDebug \
            2>&1 | tee build-error.log

      - name: Show Build Error
        if: steps.build.outcome == 'failure'
        run: |
          echo "## Android Build Error" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "آخرین 200 خط گزارش Build:" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          tail -n 200 build-error.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Build Log
        if: steps.build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: android-build-log
          path: build-error.log

      - name: Stop if Build Failed
        if: steps.build.outcome == 'failure'
        run: exit 1

      - name: Upload Client APK
        uses: actions/upload-artifact@v4
        with:
          name: mahroch-client-debug
          path: client/build/outputs/apk/debug/client-debug.apk
          if-no-files-found: error

      - name: Upload Manager APK
        uses: actions/upload-artifact@v4
        with:
          name: mahroch-manager-debug
          path: manager/build/outputs/apk/debug/manager-debug.apk
          if-no-files-found: error
